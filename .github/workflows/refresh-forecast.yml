name: Refresh Forecast Data

on:
  schedule:
    - cron: "30 1 * * *"   # 1:30 AM UTC = 7:00 AM IST daily
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the updated JSON files

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests h3

      - name: Refresh 7-day forecast risk
        run: python scripts/compute_forecast.py

      - name: Refresh river discharge forecast
        run: python scripts/fetch_river_forecast.py

      - name: Commit updated forecast files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/data/forecast_risk.json \
                  client/public/data/river_forecast.json
          # Only commit if something changed
          git diff --cached --quiet || git commit -m "chore: daily forecast refresh $(date -u +%Y-%m-%d)"
          git push
